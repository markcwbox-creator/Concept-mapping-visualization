# Real extraction on CPU, no GPU required.
#
# Slower than the 4-bit GPU path (roughly 35 minutes for the 153-concept seed
# list on 4 cores) but it needs no CUDA, no bitsandbytes, and produces exactly
# the same vectors as the GPU config at fp32. Used to generate the demo build
# committed under web/data.

concepts: data/concepts/seed_concepts.jsonl
probes: data/probes/example_probes.jsonl
build_dir: data/build
web_data_dir: web/data

encoder: hf_residual
model: Qwen/Qwen3-1.7B
layer: 18
layer_frac: 0.65
pooling: mean
templates: default
batch_size: 8
max_length: 96
device: cpu
dtype: float32
load_in_4bit: false

center: true
remove_top_k: null
whiten: false

knn_k: 24
edges_per_node: 8

n_pairs: 200
distance_percentile: 92.0
# null == derive from the graph's own hop distribution (recommended)
target_hops: null
max_per_domain_pair: 6
max_per_concept: 4

layout: auto
layout_dims: 2
reduced_dim: 256
embed_vectors: true
seed: 0
